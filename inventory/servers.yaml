# Pilot wave — 10 servers (TRD §2.2).
# Edit this file and re-run `terraform apply` to add/remove servers from MGN scope.
# Naming convention: <function>-<env>-<index>.  Priority drives the cutover schedule.

servers:
  - name: web-app-01
    os: rhel8
    vcpu: 4
    ram_gb: 16
    storage_gb: 100
    application: Customer portal web tier
    priority: P1
    target_instance_type: t3.xlarge
    target_subnet: app
    dependencies: [db-corebanking, fs-finreports]

  - name: web-app-02
    os: rhel8
    vcpu: 4
    ram_gb: 16
