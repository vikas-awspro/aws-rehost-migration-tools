name: terraform plan
on:
  pull_request:
    paths:
      - "terraform/**"
      - "inventory/**"
      - "scripts/mgn/post_launch/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/pilot
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_PILOT }}
          aws-region: ap-south-1

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --chdir=../..

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: post plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const out = execSync(
              "terraform show -no-color tfplan",
              { cwd: "terraform/environments/pilot" }
            ).toString().slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### terraform plan\n```hcl\n" + out + "\n```"
            });

      - name: fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
